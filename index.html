<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعدة بيانات الاستفسارات</title>
    <style>
        body {
            font-family: 'Cairo', Arial, sans-serif;
            direction: rtl;
            padding: 20px;
            background-color: #f8f9fa;
            color: #212529;
            transition: all 0.3s ease;
            max-width: 900px;
            margin: auto;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .card {
            border: 1px solid #ddd;
            background-color: #fff;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .card:hover {
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .download {
            background-color: #007bff;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
        .download:hover {
            background-color: #0056b3;
        }
        #darkToggle {
            margin-bottom: 20px;
            cursor: pointer;
            background-color: #343a40;
            color: white;
            padding: 10px;
            border-radius: 5px;
            border: none;
        }
        body.dark {
            background-color: #121212;
            color: #f8f9fa;
        }
        body.dark .card {
            background-color: #1e1e1e;
            border-color: #333;
        }
        body.dark input, body.dark select {
            background-color: #222;
            color: #f8f9fa;
            border-color: #444;
        }
        body.dark .download {
            background-color: #28a745;
        }
        #logo-dark {
            display: none;
            max-height: 80px;
            margin-bottom: 15px;
        }
        #logo-light {
            max-height: 80px;
            margin-bottom: 15px;
        }
        body.dark #logo-dark {
            display: block;
        }
        body.dark #logo-light {
            display: none;
        }
        hr {
            border: none;
            border-top: 1px solid #ccc;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <img src="Logo.png" id="logo-light" alt="Logo Light">
    <img src="Logo_.png" id="logo-dark" alt="Logo Dark">

    <h1>📋 قاعدة بيانات الاستفسارات</h1>
    <button id="darkToggle" onclick="toggleDark()">🌙 الوضع الليلي / ☀️ النهاري</button>
    <input type="text" id="search" placeholder="ابحث بالكلمة..." onkeyup="filterCards()">
    <select id="productFilter" onchange="filterCards()">
        <option value="">فلتر حسب المنتج</option>
    </select>
    <select id="categoryFilter" onchange="filterCards()">
        <option value="">فلتر حسب التصنيف</option>
    </select>

    <div id="data-container"></div>

    <script>
        const SHEET_URL = "https://opensheet.elk.sh/19ceXyW-gtS7ODjetKZSux2zckr7kd8fLdWxSiLKDFRc/Sheet1";
        let allData = [];

        fetch(SHEET_URL)
            .then(response => response.json())
            .then(data => {
                allData = data;
                populateFilters(data);
                document.getElementById("data-container").innerHTML = "<p>يرجى استخدام البحث أو الفلاتر لعرض النتائج.</p>";
            });

        function populateFilters(data) {
            const products = [...new Set(data.map(item => item.product).filter(Boolean))];
            const categories = [...new Set(data.map(item => item.category).filter(Boolean))];

            const productSelect = document.getElementById("productFilter");
            const categorySelect = document.getElementById("categoryFilter");

            products.forEach(product => {
                const option = document.createElement("option");
                option.value = product;
                option.textContent = product;
                productSelect.appendChild(option);
            });

            categories.forEach(category => {
                const option = document.createElement("option");
                option.value = category;
                option.textContent = category;
                categorySelect.appendChild(option);
            });
        }

        function filterCards() {
            const query = document.getElementById("search").value.toLowerCase();
            const productFilter = document.getElementById("productFilter").value;
            const categoryFilter = document.getElementById("categoryFilter").value;
            const container = document.getElementById("data-container");
            container.innerHTML = "";

            const filtered = allData.filter(item => {
                return (
                    (query === "" || Object.values(item).some(val => val && val.toLowerCase().includes(query))) &&
                    (productFilter === "" || item.product === productFilter) &&
                    (categoryFilter === "" || item.category === categoryFilter)
                );
            });

            if (query === "" && productFilter === "" && categoryFilter === "") {
                container.innerHTML = "<p>يرجى استخدام البحث أو الفلاتر لعرض النتائج.</p>";
                return;
            }

            if (filtered.length === 0) {
                container.innerHTML = "<p>لا توجد نتائج مطابقة.</p>";
            } else {
                filtered.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <p><strong>التاريخ:</strong> ${item.timestamp || ""}</p><hr>
                        <p><strong>المنتج:</strong> ${item.product || ""}</p><hr>
                        <p><strong>السؤال:</strong> ${item.question || ""}</p><hr>
                        <p><strong>الإجابة:</strong> ${item.answer || ""}</p><hr>
                        <p><strong>التصنيف:</strong> ${item.category || ""}</p>
                        ${item.document_link ? `<a href="${item.document_link}" target="_blank" class="download">📎 تحميل الملف</a>` : ""}
                    `;
                    container.appendChild(card);
                });
            }
        }

        function toggleDark() {
            document.body.classList.toggle("dark");
        }
    </script>
</body>
</html>
