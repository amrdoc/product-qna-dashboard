
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعدة بيانات الاستفسارات</title>
    <style>
        body { font-family: Arial, sans-serif; direction: rtl; padding: 20px; background-color: #f8f9fa; }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .card { border: 1px solid #ddd; background-color: #fff; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .download { color: #007bff; text-decoration: none; font-weight: bold; }
        .download:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>📋 قاعدة بيانات الاستفسارات</h1>

    <input type="text" id="search" placeholder="ابحث بالكلمة..." onkeyup="filterCards()">
    <select id="productFilter" onchange="filterCards()">
        <option value="">فلتر حسب المنتج</option>
    </select>
    <select id="categoryFilter" onchange="filterCards()">
        <option value="">فلتر حسب التصنيف</option>
    </select>

    <div id="data-container"></div>

    <script>
        const SHEET_URL = "https://opensheet.elk.sh/19ceXyW-gtS7ODjetKZSux2zckr7kd8fLdWxSiLKDFRc/Sheet1";
        let allData = [];

        fetch(SHEET_URL)
            .then(response => response.json())
            .then(data => {
                allData = data;
                populateFilters(data);
                // لا نعرض أي بيانات في البداية
                document.getElementById("data-container").innerHTML = "<p>يرجى استخدام البحث أو الفلاتر لعرض النتائج.</p>";
            });

        function populateFilters(data) {
            const products = [...new Set(data.map(item => item.product).filter(Boolean))];
            const categories = [...new Set(data.map(item => item.category).filter(Boolean))];

            const productSelect = document.getElementById("productFilter");
            const categorySelect = document.getElementById("categoryFilter");

            products.forEach(product => {
                const option = document.createElement("option");
                option.value = product;
                option.textContent = product;
                productSelect.appendChild(option);
            });

            categories.forEach(category => {
                const option = document.createElement("option");
                option.value = category;
                option.textContent = category;
                categorySelect.appendChild(option);
            });
        }

        function filterCards() {
            const query = document.getElementById("search").value.toLowerCase();
            const productFilter = document.getElementById("productFilter").value;
            const categoryFilter = document.getElementById("categoryFilter").value;
            const container = document.getElementById("data-container");
            container.innerHTML = "";

            const filtered = allData.filter(item => {
                return (
                    (query === "" || Object.values(item).some(val => val && val.toLowerCase().includes(query))) &&
                    (productFilter === "" || item.product === productFilter) &&
                    (categoryFilter === "" || item.category === categoryFilter)
                );
            });

            if (filtered.length === 0) {
                container.innerHTML = "<p>لا توجد نتائج مطابقة.</p>";
            } else {
                filtered.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <p><strong>التاريخ:</strong> ${item.timestamp || ""}</p>
                        <p><strong>المنتج:</strong> ${item.product || ""}</p>
                        <p><strong>السؤال:</strong> ${item.question || ""}</p>
                        <p><strong>الإجابة:</strong> ${item.answer || ""}</p>
                        <p><strong>التصنيف:</strong> ${item.category || ""}</p>
                        ${item.document_link ? `<a href="${item.document_link}" target="_blank" class="download">📎 تحميل الملف</a>` : ""}
                    `;
                    container.appendChild(card);
                });
            }
        }
    </script>
</body>
</html>
