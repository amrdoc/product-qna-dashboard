
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعدة بيانات الاستفسارات</title>
    <style>
        body { font-family: Arial, sans-serif; direction: rtl; padding: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        .download { color: blue; text-decoration: underline; }
    </style>
</head>
<body>
    <h1>قاعدة بيانات الاستفسارات</h1>
    <input type="text" id="search" placeholder="ابحث باسم المنتج أو السؤال أو التصنيف..." onkeyup="filterCards()">

    <div id="data-container"></div>

    <script>
        const SHEET_URL = "https://opensheet.elk.sh/19ceXyW-gtS7ODjetKZSux2zckr7kd8fLdWxSiLKDFRc/Sheet1";

        fetch(SHEET_URL)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById("data-container");
                data.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <p><strong>التاريخ:</strong> ${item.timestamp || ""}</p>
                        <p><strong>المنتج:</strong> ${item.product || ""}</p>
                        <p><strong>السؤال:</strong> ${item.question || ""}</p>
                        <p><strong>الإجابة:</strong> ${item.answer || ""}</p>
                        <p><strong>التصنيف:</strong> ${item.category || ""}</p>
                        ${item.document_link ? `<a href="${item.document_link}" target="_blank" class="download">تحميل الملف</a>` : ""}
                    `;
                    container.appendChild(card);
                });
            });

        function filterCards() {
            const query = document.getElementById("search").value.toLowerCase();
            const cards = document.querySelectorAll(".card");
            cards.forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(query) ? "block" : "none";
            });
        }
    </script>
</body>
</html>
